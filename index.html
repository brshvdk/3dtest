<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: экранная клавиатура уменьшает окно, и раскладка
         (план + панель) перестраивается, а не уезжает под клавиатуру. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Мерка — расчёт плинтуса для вашей комнаты</title>
    <meta
      name="description"
      content="Постройте свою комнату, добавьте двери, окна и проёмы — и получите точный расчёт плинтуса: сколько планок, уголков, заглушек и крепежа заказать."
    />
    <meta name="theme-color" content="#ee6a1b" />

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ee6a1b'/%3E%3Cpath d='M7 23 23 7l3 3-16 16z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='m12 18 2 2m1-5 2 2m1-5 2 2' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
